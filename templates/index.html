<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QSound: music composed by qubits</title>
  <meta name="description" content="Compose music from measured quantum circuits. Every drum hit, chord and melody note comes from a qubit, and you can click any note to see which one.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Host+Grotesk:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></symbol>
      <symbol id="i-loop" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 11v-1a4 4 0 0 1 4-4h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="m7 22-4-4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 13v1a4 4 0 0 1-4 4H3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="m18 14 4 4-4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="m18 2 4 4-4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>

  <header class="top">
    <h1 class="logo"><img src="{{ url_for('static', filename='img/qsound.png') }}" alt="QSound" width="640" height="115"></h1>

    <div class="transport" role="group" aria-label="Transport">
      <button class="gel gel--round" id="play" aria-label="Play" title="Play or pause (Space)"><svg><use href="#i-play"/></svg></button>
      <button class="gel gel--small" id="stop" aria-label="Stop and go back to the start" title="Stop"><svg><use href="#i-stop"/></svg></button>
      <button class="gel gel--small is-on" id="loop" aria-pressed="true" aria-label="Loop" title="Loop"><svg><use href="#i-loop"/></svg></button>
    </div>

    <div class="lcd" aria-label="Now playing">
      <div class="lcd__cell lcd__cell--wide"><span>Position</span><b id="lcd-pos">001.1.1</b></div>
      <div class="lcd__cell"><span>Time</span><b id="lcd-time">0:00 / 0:00</b></div>
      <div class="lcd__cell"><span>Chord</span><b id="lcd-chord">–</b></div>
      <div class="lcd__cell"><span>Section</span><b id="lcd-section">–</b></div>
      <div class="lcd__cell"><span>Tempo</span><b id="lcd-bpm">–</b></div>
      <canvas class="lcd__meter" id="meter" width="120" height="44" aria-hidden="true"></canvas>
    </div>

    <div class="exports" role="group" aria-label="Export">
      <button class="pill" id="x-wav">WAV</button>
      <button class="pill" id="x-midi">MIDI</button>
      <button class="pill" id="x-qasm">Circuits</button>
      <button class="pill" id="x-json">Record</button>
    </div>
  </header>

  <aside class="composer panel" aria-label="Composer">
    <fieldset class="styles">
      <legend>Style</legend>
      {% for s in styles %}
      <label class="style">
        <input type="radio" name="style" value="{{ s.id }}" data-bpm="{{ s.bpm }}" data-mode="{{ s.mode }}" {% if loop.first %}checked{% endif %}>
        <span class="style__name">{{ s.name }}</span>
        <span class="style__blurb">{{ s.blurb }}</span>
      </label>
      {% endfor %}
    </fieldset>

    <div class="row2">
      <label class="field">Key
        <select id="key">{% for k in keys %}<option {% if k == 'A' %}selected{% endif %}>{{ k }}</option>{% endfor %}</select>
      </label>
      <label class="field">Mode
        <select id="mode">{% for m in modes %}<option>{{ m }}</option>{% endfor %}</select>
      </label>
    </div>

    <label class="field">Tempo <output id="bpm-out">122</output>
      <input type="range" id="bpm" min="60" max="190" value="122">
    </label>

    <fieldset class="segmented">
      <legend>Length in bars</legend>
      {% for b in bars %}
      <label><input type="radio" name="bars" value="{{ b }}" {% if b == 16 %}checked{% endif %}><span>{{ b }}</span></label>
      {% endfor %}
    </fieldset>

    <label class="field">Entanglement <output id="ent-out">80%</output>
      <input type="range" id="ent" min="0" max="100" value="80">
      <small>Low: each hit is on its own, chords stay predictable. High: bass locks to kick, melodies run, chords roam.</small>
    </label>

    <label class="field">Decoherence <output id="noise-out">0%</output>
      <input type="range" id="noise" min="0" max="100" value="0">
      <small>Real depolarizing noise on the gates. Turn it up and the groove falls apart.</small>
    </label>

    <div class="seed">
      <label class="field">Seed
        <input type="number" id="seed" min="0" max="2147483646" value="1197">
      </label>
      <button class="pill pill--icon" id="dice" aria-label="New seed and compose" title="New seed and compose"><svg><use href="#i-shuffle"/></svg></button>
    </div>

    <button class="gel gel--wide" id="compose">Compose</button>
    <p class="status" id="status" role="status"></p>

    <div class="remeasure" role="group" aria-labelledby="remeasure-label">
      <span id="remeasure-label">Measure one layer again</span>
      <div>
        <button class="pill" data-layer="harmony">Chords</button>
        <button class="pill" data-layer="groove">Groove</button>
        <button class="pill" data-layer="melody">Melody</button>
      </div>
    </div>
  </aside>

  <main class="arrange panel" aria-label="Arrangement">
    <div class="tracks" id="tracks"></div>
    <div class="lanes">
      <canvas id="arrangement" tabindex="0" aria-label="Arrangement. Click a note to see which qubit decided it. Click anywhere else to move the playhead."></canvas>
    </div>
    <div class="trace" id="trace" aria-live="polite">Click any note to see which qubit decided it.</div>
  </main>

  <section class="lab panel" aria-label="Inside the circuits">
    <div class="tabs" role="tablist">
      <button role="tab" class="tab is-on" data-tab="groove" aria-selected="true">Groove state</button>
      <button role="tab" class="tab" data-tab="circuit" aria-selected="false">Circuit</button>
      <button role="tab" class="tab" data-tab="walk" aria-selected="false">Chord walk</button>
      <button role="tab" class="tab" data-tab="record" aria-selected="false">Record</button>
      <select id="circuit-pick" class="circuit-pick" aria-label="Which circuit" hidden></select>
    </div>
    <div class="views">
      <div class="view is-on" data-view="groove" id="view-groove"></div>
      <div class="view" data-view="circuit" id="view-circuit"><div class="circuit-scroll" id="circuit-scroll"><div id="circuit-size"></div></div><canvas id="circuit-canvas" aria-label="Circuit diagram"></canvas></div>
      <div class="view" data-view="walk" id="view-walk"></div>
      <div class="view" data-view="record" id="view-record"></div>
    </div>
  </section>

  <section class="scope panel" aria-label="Live audio">
    <canvas id="spectro" aria-hidden="true"></canvas>
    <canvas id="wave" aria-hidden="true"></canvas>
  </section>

  <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
